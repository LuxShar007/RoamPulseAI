<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Emerald Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14302F" />
      <stop offset="100%" stop-color="#071716" />
    </radialGradient>

    <!-- Neon Mint Pulse Line Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00E5C0" />
      <stop offset="100%" stop-color="#00BFA5" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00E5C0" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Outer Chassis Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#mintGrad)" stroke-width="10" filter="url(#pinGlow)" />

  <!-- Concentric Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0, 229, 192, 0.25)" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(0, 229, 192, 0.4)" stroke-width="4" />

  <!-- GPS Pin Backdrop Silhouette -->
  <path d="M 256 100 C 190 100 136 154 136 220 C 136 310 256 420 256 420 C 256 420 376 310 376 220 C 376 154 322 100 256 100 Z"
        fill="rgba(0, 229, 192, 0.12)" stroke="url(#mintGrad)" stroke-width="6" />

  <!-- Center Heartbeat Waveform Line (RoamPulse Wave) -->
  <path d="M 170 230 L 210 230 L 230 170 L 256 290 L 280 200 L 298 245 L 315 230 L 342 230"
        fill="none" stroke="url(#mintGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Center Pulse Sparkle Dot -->
  <circle cx="256" cy="290" r="10" fill="#FFFFFF" filter="url(#neonGlow)" />
</svg>
